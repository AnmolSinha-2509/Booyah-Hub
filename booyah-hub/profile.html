<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booyah HUB - Profile</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .profile-card { background: #141721; border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; padding: 25px; width: 100%; max-width: 480px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); text-align: center; }
        .avatar-container { position: relative; width: 100px; height: 100px; margin: 0 auto 15px auto; }
        .main-avatar-view { width: 100px; height: 100px; border-radius: 50%; border: 2px solid #00ffcc; display: flex; align-items: center; justify-content: center; background: #0b0d12; font-size: 42px; color: #00ffcc; box-shadow: 0 0 20px rgba(0,255,204,0.2); }
        .avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 15px 0; }
        .avatar-select { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); color: #8c91a2; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 18px; transition: 0.2s; }
        .avatar-select.active { background: rgba(0,255,204,0.15); color: #00ffcc; border-color: #00ffcc; box-shadow: 0 0 10px rgba(0,255,204,0.1); }
        .form-terminal-input { width: 100%; bg-color: #0b0d12; border: 1px solid rgba(255,255,255,0.08); background: #0b0d12; color: #fff; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-family: 'Roboto'; font-size: 14px; }
        .form-terminal-input:focus { border-color: #00ffcc; outline: none; }
        .btn-primary { background: linear-gradient(135deg, #00ffcc, #00b3ff); color: #000; font-family: 'Rajdhani'; font-weight: 700; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; }
    </style>
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; padding-bottom: 90px; background-color: #0b0d12;">

    <div class="profile-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div class="logo" style="font-size: 20px;">WARRIOR<span>ID</span></div>
            <button id="logout-btn" style="background: transparent; border: 1px solid #ff3333; color: #ff3333; padding: 6px 15px; border-radius: 6px; font-family: 'Rajdhani'; font-weight: bold; cursor: pointer;">LOGOUT</button>
        </div>

        <div id="view-state">
            <div class="avatar-container">
                <div class="main-avatar-view"><i id="v-avatar" class="fas fa-user-secret"></i></div>
            </div>
            <h2 id="v-username" style="font-family: 'Rajdhani'; font-size: 24px; color: #fff; margin-bottom: 5px;">Gamer</h2>
            <p id="v-email" style="font-size: 13px; color: #8c91a2; margin-bottom: 15px;">tactical@node.com</p>
            <div style="background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: left;">
                <span style="font-size: 11px; color: #00ffcc; font-family: 'Rajdhani'; font-weight: bold; display: block; margin-bottom: 5px;">BIOGRAPHY PACKET</span>
                <p id="v-bio" style="font-size: 14px; color: #dfdfdf; line-height: 1.4;">No bio set.</p>
            </div>
            <div style="display: flex; gap: 15px; justify-content: center; font-size: 14px; color: #8c91a2; margin-bottom: 20px;">
                <span><i class="fab fa-discord" style="color: #5865F2;"></i> <span id="v-discord">Not Linked</span></span>
            </div>
            <button id="edit-trigger-btn" class="btn-primary">Modify Matrix</button>
        </div>

        <form id="edit-state" style="display: none; text-align: left;">
            <label style="font-family:'Rajdhani'; font-size:12px; color:#8c91a2; font-weight:bold;">CHOOSE AVATAR</label>
            <div class="avatar-grid">
                <button type="button" class="avatar-select" data-icon="fa-user-secret"><i class="fas fa-user-secret"></i></button>
                <button type="button" class="avatar-select" data-icon="fa-ghost"><i class="fas fa-ghost"></i></button>
                <button type="button" class="avatar-select" data-icon="fa-skull-crossbones"><i class="fas fa-skull-crossbones"></i></button>
                <button type="button" class="avatar-select" data-icon="fa-robot"><i class="fas fa-robot"></i></button>
            </div>
            <label style="font-family:'Rajdhani'; font-size:12px; color:#8c91a2; font-weight:bold;">CODENAME / USERNAME</label>
            <input type="text" id="inp-username" class="form-terminal-input" required autocomplete="off">
            <label style="font-family:'Rajdhani'; font-size:12px; color:#8c91a2; font-weight:bold;">TACTICAL BIO</label>
            <textarea id="inp-bio" class="form-terminal-input" style="height: 70px; resize: none;" required></textarea>
            <label style="font-family:'Rajdhani'; font-size:12px; color:#8c91a2; font-weight:bold;">DISCORD REF HASH</label>
            <input type="text" id="inp-discord" class="form-terminal-input" placeholder="Gamer#0000" autocomplete="off">
            
            <p id="status-text" style="display: none; color: #00ffcc; font-size: 13px; margin-bottom: 10px; font-weight: bold; text-align: center;"></p>
            
            <div style="display: flex; gap: 10px;">
                <button type="submit" class="btn-primary" style="flex: 2;">Save Changes</button>
                <button type="button" id="edit-cancel-btn" class="btn-primary" style="flex: 1; background: transparent; border: 1px solid rgba(255,255,255,0.1); color: #fff;">Cancel</button>
            </div>
        </form>
    </div>

    <nav class="bottom-nav">
        <a href="tournaments.html" class="nav-item"><i class="fas fa-trophy"></i><span>Matches</span></a>
        <a href="wallet.html" class="nav-item"><i class="fas fa-wallet"></i><span>Wallet</span></a>
        <a href="index.html" class="nav-item home-highlight"><div class="home-circle"><i class="fas fa-gamepad"></i></div></a>
        <a href="community.html" class="nav-item"><i class="fas fa-comments"></i><span>Lounge</span></a>
        <a href="profile.html" class="nav-item active"><i class="fas fa-user-gear"></i><span>Profile</span></a>
    </nav>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        const viewState = document.getElementById('view-state');
        const editState = document.getElementById('edit-state');
        const statusText = document.getElementById('status-text');

        const vAvatar = document.getElementById('v-avatar');
        const vUsername = document.getElementById('v-username');
        const vEmail = document.getElementById('v-email');
        const vBio = document.getElementById('v-bio');
        const vDiscord = document.getElementById('v-discord');

        const editUser = document.getElementById('inp-username');
        const editBio = document.getElementById('inp-bio');
        const editDisc = document.getElementById('inp-discord');
        const avBtns = document.querySelectorAll('.avatar-select');

        let currentUid = null;
        let selectedIcon = "fa-user-secret";

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUid = user.uid;
                fetchAndRenderProfile();
            } else {
                window.location.href = "login.html";
            }
        });

        async function fetchAndRenderProfile() {
            const snap = await getDoc(doc(db, "users", currentUid));
            if (snap.exists()) {
                const data = snap.data();
                vUsername.innerText = data.username || "Gamer";
                vEmail.innerText = auth.currentUser.email;
                vBio.innerText = data.bio || "No bio set.";
                vDiscord.innerText = data.discord || "Not Linked";
                vAvatar.className = `fas ${data.avatar || 'fa-user-secret'}`;
                
                editUser.value = data.username || "";
                editBio.value = data.bio || "";
                editDisc.value = data.discord || "";
                selectedIcon = data.avatar || "fa-user-secret";
                updateAvatarUI(selectedIcon);
            }
        }

        document.getElementById('edit-trigger-btn').addEventListener('click', () => {
            viewState.style.display = "none"; editState.style.display = "block";
        });
        document.getElementById('edit-cancel-btn').addEventListener('click', () => {
            editState.style.display = "none"; viewState.style.display = "block";
        });

        avBtns.forEach(btn => btn.addEventListener('click', () => {
            selectedIcon = btn.getAttribute('data-icon');
            updateAvatarUI(selectedIcon);
        }));

        function updateAvatarUI(icon) {
            avBtns.forEach(b => b.classList.remove('active'));
            const dynamicTarget = document.querySelector(`[data-icon="${icon}"]`);
            if (dynamicTarget) dynamicTarget.classList.add('active');
        }

        editState.addEventListener('submit', async (e) => {
            e.preventDefault();
            statusText.style.display = "block"; statusText.innerText = "Syncing profile matrix...";
            
            await setDoc(doc(db, "users", currentUid), {
                username: editUser.value,
                bio: editBio.value,
                discord: editDisc.value,
                avatar: selectedIcon
            }, { merge: true });
            
            statusText.innerText = "Profile Sync Complete!";
            setTimeout(() => {
                statusText.style.display = "none"; editState.style.display = "none"; viewState.style.display = "block";
                fetchAndRenderProfile();
            }, 1000);
        });

        document.getElementById('logout-btn').addEventListener('click', async () => {
            if (auth.currentUser) {
                try {
                    await updateDoc(doc(db, "users", auth.currentUser.uid), { isOnline: false });
                } catch (e) { console.error(e); }
            }
            signOut(auth).then(() => { window.location.href = "login.html"; });
        });
    </script>
</body>
</html>
