<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booyah HUB - Security & Admin Master Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0d0e12] text-white antialiased">

    <div id=\"admin-auth-wall\" class="fixed inset-0 bg-[#0d0e12] flex flex-col items-center justify-center z-[100] p-4">
        <div class="bg-[#161922] p-8 rounded-2xl max-w-md w-full border border-gray-800 shadow-2xl text-center space-y-5">
            <div class="w-16 h-16 bg-red-500/10 text-red-500 rounded-full flex items-center justify-center text-2xl mx-auto border border-red-500/20">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <div>
                <h1 class="text-xl font-black tracking-wider text-red-500 uppercase">Master Security Wall</h1>
                <p class="text-xs text-gray-400 mt-1">Authorized Clearance Personnel Only</p>
            </div>
            <form id="admin-auth-form" class="space-y-3 text-left">
                <div>
                    <label class="block text-[10px] uppercase font-bold text-gray-400 mb-1">Secure Email</label>
                    <input id="admin-email" type="email" required class="w-full bg-[#0d0e12] border border-gray-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-red-500 transition-all">
                </div>
                <div>
                    <label class="block text-[10px] uppercase font-bold text-gray-400 mb-1">Access Token Key</label>
                    <input id="admin-password" type="password" required class="w-full bg-[#0d0e12] border border-gray-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-red-500 transition-all">
                </div>
                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold text-xs uppercase tracking-wider py-3 rounded-xl transition-all shadow-lg shadow-red-600/10">Request Verification</button>
            </form>
            <p id="admin-auth-error" class="text-xs text-red-400 font-medium hidden pt-1"></p>
        </div>
    </div>

    <header class="bg-[#141721] border-b border-gray-800 px-6 py-4 flex items-center justify-between sticky top-0 z-40 shadow-xl">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-[#00ffcc]/10 border border-[#00ffcc]/20 rounded-xl flex items-center justify-center text-[#00ffcc]">
                <i class="fa-solid fa-terminal text-lg"></i>
            </div>
            <div>
                <div class="font-black text-sm uppercase tracking-widest text-[#00ffcc]">BOOYAH<span class="text-white">HUB</span></div>
                <div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Admin System Panel</div>
            </div>
        </div>
        <button id="admin-logout-btn" class="bg-gray-800/50 hover:bg-red-600/10 hover:text-red-500 border border-gray-700/50 hover:border-red-500/20 px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition-all">Disconnect</button>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <section class="lg:col-span-1 space-y-6">
            <div class="bg-[#141721] border border-gray-800 rounded-2xl p-5 shadow-lg space-y-4">
                <div class="flex items-center gap-2 border-b border-gray-800/60 pb-3">
                    <i class="fa-solid fa-square-plus text-[#00ffcc]"></i>
                    <h2 class="text-xs font-black uppercase tracking-wider text-gray-300">Create Tournament Pipeline</h2>
                </div>
                
                <form id="panel-tournament-create-form" class="space-y-4">
                    <div>
                        <label class="block text-[10px] uppercase font-bold text-gray-400 mb-1">Game Map Title</label>
                        <input id="p-t-title" type="text" placeholder="e.g. Squad Pro Showdown [T2]" required class="w-full bg-[#0d0e12] border border-gray-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-[#00ffcc]">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase font-bold text-gray-400 mb-1">Banner Graphic Matrix URL</label>
                        <input id="p-t-banner" type="url" placeholder="https://images.unsplash.com/..." class="w-full bg-[#0d0e12] border border-gray-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-[#00ffcc]">
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <div>
                            <label class="block text-[10px] uppercase font-bold text-gray-400 mb-1">Prize Pool (₹)</label>
                            <input id="p-t-prize" type="number" min="0" placeholder="25000" required class="w-full bg-[#0d0e12] border border-gray-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-[#00ffcc]">
                        </div>
                        <div>
                            <label class="block text-[10px] uppercase font-bold text-gray-400 mb-1">Entry Fee (₹)</label>
                            <input id="p-t-fee" type="number" min="0" placeholder="10" required class="w-full bg-[#0d0e12] border border-gray-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-[#00ffcc]">
                        </div>
                        <div>
                            <label class="block text-[10px] uppercase font-bold text-gray-400 mb-1">Total Slots</label>
                            <input id="p-t-slots" type="number" min="2" placeholder="48" required class="w-full bg-[#0d0e12] border border-gray-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-[#00ffcc]">
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-[#00ffcc] hover:bg-[#00e6b8] text-black font-black text-xs uppercase tracking-wider py-3 rounded-xl transition-all shadow-lg shadow-[#00ffcc]/10">Inject Tournament</button>
                </form>
            </div>

            <div class="bg-[#141721] border border-gray-800 rounded-2xl p-5 shadow-lg space-y-4">
                <div class="flex items-center gap-2 border-b border-gray-800/60 pb-3">
                    <i class="fa-solid fa-vault text-yellow-500"></i>
                    <h2 class="text-xs font-black uppercase tracking-wider text-gray-300">Vault Balance Override</h2>
                </div>
                <form id="panel-wallet-override-form" class="space-y-4">
                    <div>
                        <label class="block text-[10px] uppercase font-bold text-gray-400 mb-1">Target Player UID Hash</label>
                        <input id="p-w-uid" type="text" placeholder="Paste user authentication UID string" required class="w-full bg-[#0d0e12] border border-gray-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-yellow-500">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase font-bold text-gray-400 mb-1">Overwrite Coins (Diamonds Vault Balance)</label>
                        <input id="p-w-coins" type="number" min="0" placeholder="Set absolute balance" required class="w-full bg-[#0d0e12] border border-gray-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-yellow-500">
                    </div>
                    <button type="submit" class="w-full bg-yellow-600 hover:bg-yellow-700 text-white font-bold text-xs uppercase tracking-wider py-3 rounded-xl transition-all shadow-lg shadow-yellow-600/10">Rewrite Vault Ledger</button>
                </form>
            </div>
        </section>

        <section class="lg:col-span-2 space-y-4">
            <div class="flex items-center justify-between border-b border-gray-800 pb-2">
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                    <h2 class="text-xs font-black uppercase tracking-widest text-gray-400">Live Active Lobbies Stream</h2>
                </div>
                <span id="live-lobbies-counter" class="text-[10px] font-bold bg-[#141721] border border-gray-800 px-2.5 py-1 rounded-full text-gray-400">0 Lobbies Active</span>
            </div>

            <div id="admin-tournaments-stream-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="col-span-full py-12 flex flex-col items-center justify-center text-center text-gray-500 space-y-2 border border-dashed border-gray-800 rounded-2xl">
                    <i class="fa-solid fa-satellite-dish text-xl animate-pulse"></i>
                    <p class="text-xs uppercase font-bold tracking-wider">Awaiting Secure Sync Nodes...</p>
                </div>
            </div>
        </section>
    </main>

    <div id="admin-edit-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-[#141721] border border-gray-800 w-full max-w-lg rounded-2xl p-6 shadow-2xl space-y-4 transform scale-95 transition-all">
            <div class="flex items-center justify-between border-b border-gray-800 pb-3">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-blue-400"></i>
                    <h3 class="text-xs font-black uppercase tracking-wider text-white">Modify Live Map Node</h3>
                </div>
                <button onclick="closeEditModal()" class="text-gray-400 hover:text-white transition-all text-sm"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-3">
                <input id="edit-t-id" type="hidden">
                <div>
                    <label class="block text-[10px] uppercase font-bold text-gray-400 mb-1">Modify Title</label>
                    <input id="edit-t-title" type="text" class="w-full bg-[#0d0e12] border border-gray-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-[10px] uppercase font-bold text-gray-400 mb-1">Modify Banner Graphic Link</label>
                    <input id="edit-t-banner" type="url" class="w-full bg-[#0d0e12] border border-gray-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-blue-500">
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-[10px] uppercase font-bold text-gray-400 mb-1">Prize Pool</label>
                        <input id="edit-t-prize" type="number" min="0" class="w-full bg-[#0d0e12] border border-gray-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase font-bold text-gray-400 mb-1">Entry Fee</label>
                        <input id="edit-t-fee" type="number" min="0" class="w-full bg-[#0d0e12] border border-gray-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase font-bold text-gray-400 mb-1">Slots</label>
                        <input id="edit-t-slots" type="number" min="2" class="w-full bg-[#0d0e12] border border-gray-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
                    </div>
                </div>
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="saveTournamentEdits()" class="flex-1 bg-green-600 hover:bg-green-700 py-2 rounded-xl font-bold uppercase tracking-wider text-xs text-white">Save Changes</button>
                <button onclick="closeEditModal()" class="bg-gray-800 hover:bg-gray-700 px-5 py-2 rounded-xl font-bold uppercase tracking-wider text-xs text-gray-300">Cancel</button>
            </div>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
